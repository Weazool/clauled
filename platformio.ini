; Declared so the -ffile-prefix-map flags below can interpolate the package and
; build directories. Everything in it stays at PlatformIO's defaults.
[platformio]

[env:esp32-c3-mini]
platform  = espressif32
board     = esp32-c3-devkitm-1
framework = arduino

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Raise to 5 to expose the ESP-IDF WiFi driver's auth/assoc/handshake
    ; state machine over USB serial when debugging connection problems.
    -DCORE_DEBUG_LEVEL=1

; Keeps the build machine's absolute paths (and with them its OS username) out
; of the firmware image. Must be a script, not a build_flag - see the file.
extra_scripts = pre:scripts/strip_build_paths.py

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

board_build.partitions = default.csv

lib_deps =
    adafruit/Adafruit SH110X @ ^2.1.12
    adafruit/Adafruit GFX Library @ ^1.11.9
    bblanchon/ArduinoJson @ ^7.2.0
